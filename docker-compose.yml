services:

  postgres:
    image: postgres:16
    container_name: mora_db
    restart: always
    environment:
      POSTGRES_DB: mora
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - mora_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mora"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: mora_backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mora
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      MORA_JWT_SECRET: mora2024SecretKeyParaJWTMuySeguraYLarga1234567890
      MORA_JWT_EXPIRATION: 604800000

volumes:
  mora_data: